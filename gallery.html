    <section class="section section-alt">
      <div class="container">
        <!--
          ADDING REAL PHOTOS: replace a placeholder <div> with an <img> like this:

          <img class="gallery-photo"
               src="images/geyser-randburg.webp"
               alt="Newly installed 150-litre geyser with drip tray in a Randburg roof space"
               width="1200" height="900"
               loading="lazy" decoding="async">

          - alt: describe what is actually in the photo (what, where), as if
            telling someone who can't see it. Don't just repeat "plumbing Johannesburg".
          - width/height: the photo's real pixel size (4:3 shape fits the grid best).
            This stops the page jumping around while photos load.
          - loading="lazy": photos further down only download when scrolled to.
            Leave it off the first one or two photos if they appear at the top of the screen.
          - Resize photos to about 1200px wide and save as WebP or compressed JPEG
            (aim for under 200 KB each) before uploading.
        -->
        <div class="gallery-grid">
          <figure class="gallery-item">
            <div class="gallery-photo gallery-placeholder" aria-hidden="true">Photo coming soon</div>
            <figcaption>New geyser installation in Randburg</figcaption>
          </figure>

          <figure class="gallery-item">

          <figure class="gallery-item">

            <figcaption>New-build plumbing installation</figcaption>
          </figure>
        </div>
